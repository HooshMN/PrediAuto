<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrediAuto - L'avenir de votre voiture</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* On place le conteneur de la route en arrière-plan absolu */
        .road-container {
            position: absolute;   
            top: 70%;             
            transform: translateY(-50%); 
            left: 0;
            width: 100%;
            height: 100px;        
            z-index: -1;          
            overflow: hidden;     
            pointer-events: none; 

            /* --- CENTRAGE FLEXBOX (NOUVEAU) --- */
            display: flex;
            align-items: center; /* Centre verticalement la voiture dans la route */
            
            /* IMAGE DE ROUTE */
            background-image: url('img/road.png'); 
            background-repeat: repeat-x; 
            background-position: center; 
            border-top: 3px solid #444;
            border-bottom: 3px solid #444;
        }

        /* La voiture */
        .moving-car {
            width: 150px;
            opacity: 1; /* Plus visible */
            
            /* --- AJUSTEMENT FIN (MODIFIABLE) --- */
            /* Si la voiture semble "voler", augmentez ce chiffre (ex: 10px) */
            /* Si la voiture est trop basse, mettez un chiffre négatif (ex: -10px) */
            margin-top: 0px; 

            /* Animation */
            animation: driveAcross 4s linear infinite; 
        }

        @keyframes driveAcross {
            0% {
                transform: translateX(-200px); 
            }
            100% {
                transform: translateX(100vw); 
            }
        }
        
        body {
            overflow-x: hidden;
            position: relative;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-chart-line"></i> Predi<span>Auto</span>
        </div>
        <div class="nav-links">
            <a href="datas/dashboard.html">Comment ça marche ? (Data)</a>
        </div>
    </nav>

    <div class="road-container">
        <img src="img/car.png" alt="Voiture animée" class="moving-car">
    </div>

    <div class="container">
        
        <div class="card form-card">
            <div class="header-text">
                <h1>Estimez la valeur réelle & future.</h1>
                <p>Notre IA analyse le marché pour prédire le prix juste aujourd'hui et sa dépréciation à 2 ans.</p>
            </div>

            <form id="predictionForm">
                <div class="input-group">
                    <label>Marque</label>
                    <select id="make" required>
                        <option value="" disabled selected>Choisir...</option>
                        <option value="Renault">Renault</option>
                        <option value="Peugeot">Peugeot</option>
                        <option value="Volkswagen">Volkswagen</option>
                        <option value="Audi">Audi</option>
                        <option value="BMW">BMW</option>
                        <option value="Mercedes">Mercedes</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Modèle</label>
                    <input type="text" id="model" placeholder="Ex: Clio 5, Golf 7..." required>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Année</label>
                        <input type="number" id="year" placeholder="2020" min="1990" max="2025" required>
                    </div>
                    <div class="input-group">
                        <label>Kilométrage</label>
                        <input type="number" id="km" placeholder="50000" required>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Carburant</label>
                        <select id="fuel">
                            <option value="Essence">Essence</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Hybride">Hybride</option>
                            <option value="Electrique">Électrique</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Boîte de vitesse</label>
                        <select id="gearbox">
                            <option value="Manuelle">Manuelle</option>
                            <option value="Automatique">Automatique</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">Lancer l'analyse</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <div class="card result-card hidden" id="resultCard">
            <div class="loading" id="loader">
                <div class="spinner"></div>
                <p>Analyse du marché en cours...</p>
            </div>

            <div class="result-content hidden" id="resultContent">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
