<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrediAuto - Estimation IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
:root { --bg-dark: #09090b; --accent: #f59e0b; --accent-hover: #d97706; --accent-elec: #3b82f6; --text-main: #f4f4f5; --text-muted: #a1a1aa; }
        body { background: radial-gradient(circle at top left, #27272a, #000000); font-family: 'Inter', sans-serif; margin: 0; color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { font-size: 1.5rem; font-weight: 800; color: white; }
        .logo span { color: var(--accent); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; flex: 1; padding-top: 50px; padding-bottom: 50px; z-index: 5; }
        .intro-card { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); border-left: 4px solid var(--accent); margin-top: 50px; }
        .intro-card h1 { font-size: 2.8rem; margin: 0; line-height: 1.1; font-weight: 800; text-transform: uppercase; }
        
        .tabs-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer; background: #18181b; color: #71717a; transition: 0.3s; border: 1px solid transparent; }
        .tab-btn.active-fossil { background: rgba(245, 158, 11, 0.1); color: var(--accent); border-color: var(--accent); }
        .tab-btn.active-elec { background: rgba(59, 130, 246, 0.1); color: var(--accent-elec); border-color: var(--accent-elec); }
        
        .form-card { background: linear-gradient(145deg, #1f1f22, #111113); padding: 35px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); border: 1px solid rgba(255, 255, 255, 0.05); }
        .section-title { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: bold; }
        body.mode-elec .section-title { color: var(--accent-elec); }
        body.mode-elec .logo span { color: var(--accent-elec); }
        body.mode-elec .intro-card { border-left-color: var(--accent-elec); }
        
        .input-group { margin-bottom: 15px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #09090b; border: 1px solid #3f3f46; border-radius: 8px; color: white; font-size: 1rem; outline: none; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--accent); }
        body.mode-elec input:focus, body.mode-elec select:focus { border-color: var(--accent-elec); }
        
        #submitBtn { width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); color: black; font-weight: 800; text-transform: uppercase; cursor: pointer; display: flex; justify-content: center; gap: 10px; transition: 0.3s; }
        body.mode-elec #submitBtn { background: linear-gradient(135deg, var(--accent-elec) 0%, #2563eb 100%); color: white; }
        
        .hidden { display: none; }
        .loading { display: none; text-align: center; color: white; margin-top: 20px; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        body.mode-elec .spinner { border-left-color: var(--accent-elec); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .road-container { position: absolute; top: 85%; width: 100%; height: 120px; background: url('img/road.png') repeat-x center; opacity: 0.6; z-index: 0; display: flex; align-items: center; border-top: 2px solid #333; }
        .moving-car { width: 150px; animation: drive 6s linear infinite; margin-top: -10px; filter: drop-shadow(0 10px 5px black); }
        @keyframes drive { 0% { transform: translateX(-200px); } 100% { transform: translateX(100vw); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="mode-fossil"> 
    <nav>
        <div class="logo"><i class="fa-solid fa-gauge-high"></i> Predi<span>Auto</span></div>
        <div class="nav-links"><a href="#">Admin</a></div>
    </nav>
    <div class="road-container"><img src="img/car.png" alt="Voiture" class="moving-car"></div>

    <div class="container">
        
        <div class="intro-card">
            <h1 id="mainTitle">VALEUR <span style="color:var(--accent)">THERMIQUE</span></h1>
            <p id="mainDesc">Estimation précise pour véhicules Essence, Diesel et Hybrides classiques.</p>
        </div>

        <div class="form-card">
            <div class="tabs-container">
                <button type="button" class="tab-btn active-fossil" onclick="switchMode('fossil')"><i class="fa-solid fa-gas-pump"></i> Thermique</button>
                <button type="button" class="tab-btn" onclick="switchMode('electric')"><i class="fa-solid fa-bolt"></i> Électrique</button>
            </div>

            <form id="predictionForm">
                <input type="hidden" id="engineType" value="fossil">

                <div class="section-title"><i class="fa-solid fa-circle-info"></i> Base (Obligatoire)</div>
                <div class="input-group">
                    <label>Marque *</label>
                    <select id="make" required>
                        <option value="" disabled selected>Choisir...</option>
                        </select>
                </div>
                <div class="input-group">
                    <label>Modèle *</label>
                    <input type="text" id="model" list="modelList" placeholder="Entrer le nom de votre modèle" required autocomplete="off">
                    <datalist id="modelList"></datalist>
                    <small id="modelHelp" style="font-size: 0.7rem; color: #ef4444; display: none;">Veuillez sélectionner une marque d'abord.</small>
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>Année *</label>
                        <input type="number" id="year" placeholder="2020" min="1990" max="2025" required>
                    </div>
                    <div class="input-group">
                        <label>Énergie *</label>
                        <select id="fuel" required></select>
                    </div>
                </div>

                <div class="section-title opt" style="margin-top: 25px; border-top: 1px dashed #333; padding-top: 15px;">
                    <i class="fa-solid fa-sliders"></i> Technique (Optionnel)
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Kilométrage</label>
                        <input type="number" id="km" placeholder="Ex: 80 000" step="1">
                    </div>
                    <div class="input-group" id="dynamicField">
                        <label>Boîte de vitesse</label>
                        <select id="gearbox"><option value="">Indifférent</option><option value="Manuelle">Manuelle</option><option value="Automatique">Automatique</option></select>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Puissance (DIN)</label>
                        <input type="number" id="puissancedin" placeholder="Ex: 110">
                    </div>
                     <div class="input-group">
                        <label>Puissance (CV)</label>
                        <input type="number" id="puissancefiscale" placeholder="Ex: 6">
                    </div>
                </div>

                <div class="row-3">
                    <div class="input-group">
                        <label>Portes</label>
                        <select id="portes"><option value="">?</option><option value="3">3</option><option value="5">5</option></select>
                    </div>
                    <div class="input-group">
                        <label>Places</label>
                        <select id="places"><option value="">?</option><option value="2">2</option><option value="4">4</option><option value="5">5</option><option value="7">7</option></select>
                    </div>
                    <div class="input-group">
                        <label>Dépt (CP)</label>
                        <input type="number" id="dept" placeholder="Ex: 75">
                    </div>
                </div>
                
                 <div class="input-group" style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
                    <input type="checkbox" id="premiereMain" style="width: auto;">
                    <label for="premiereMain" style="margin:0; cursor:pointer;">C'est une Première Main ?</label>
                </div>

                <div class="row hidden" id="batteryRow">
                    <div class="input-group">
                        <label>Autonomie (km)</label>
                        <input type="number" id="autonomie" placeholder="Ex: 400">
                    </div>
                    <div class="input-group">
                        <label>Batterie (kWh)</label>
                        <input type="number" id="capacite" placeholder="Ex: 50">
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="btn-text">Estimer</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <div class="form-card hidden" id="resultCard" style="grid-column: span 2; max-width: 600px; margin: 0 auto; text-align: center;">
            <div class="loading" id="loader">
                <div class="spinner"></div>
                <p>Analyse du marché en cours...</p>
            </div>
            <div id="resultContent" class="hidden"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
